[workspace]
resolver = "2"
members = [
    "crates/nebenk-core",
    "crates/nebenk-identity",
    "crates/nebenk-storage",
    "crates/nebenk-wasm",
    "crates/nebenk-runtime",
    "crates/nebenk-network",
    "crates/nebenk-replication",
    "crates/nebenk-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["NEBENK Contributors"]
license = "Apache-2.0"
repository = "https://github.com/AdakHaddad/nebenk"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
cbor4ii = { version = "1.0", features = ["serde"] }
thiserror = "2.0"
tokio = { version = "1.43", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
blake3 = "1.5"
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
rand = "0.8"
rusqlite = { version = "0.33", features = ["bundled"] }
tokio-rusqlite = "0.6"
wasmtime = "29.0"
wasmtime-wasi = "29.0"
clap = { version = "4.5", features = ["derive"] }
anyhow = "1.0"
bytes = "1.10"
bs58 = "0.5"
tempfile = "3.17"

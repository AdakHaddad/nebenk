[package]
name = "nebenk-marketplace"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = []
blockchain = ["alloy"]

[dependencies]
nebenk-core = { path = "../nebenk-core" }
nebenk-identity = { path = "../nebenk-identity" }
nebenk-network = { path = "../nebenk-network" }
nebenk-storage = { path = "../nebenk-storage" }
nebenk-membership = { path = "../nebenk-membership" }
libp2p = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
cbor4ii = { version = "1.0", features = ["serde1"] }
blake3 = "1.5"
ed25519-dalek = "2.0"
rand = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
async-trait = "0.1"
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# Blockchain dependencies - optional feature
alloy = { workspace = true, optional = true }

[dev-dependencies]
tempfile = "3.17"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "marketplace_bench"
harness = false
